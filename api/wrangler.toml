name = "dutch-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "dutch"
database_id = "00000000-0000-0000-0000-000000000000" # REPLACE with id from `wrangler d1 create dutch`

[vars]
# Origins allowed to call /mcp from a browser (comma-separated, or "*"). Requests without Origin are always allowed.
MCP_ALLOWED_ORIGINS = "*"
